{% extends "base.html" %}

{% block title %}Вход - Интернет-магазин{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto;">
    <h1 style="text-align: center;">Вход в аккаунт</h1>
    
    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        {% if error %}
            <div style="background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 4px; margin-bottom: 20px;">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
                Войти
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px;">
            Нет аккаунта? 
            <a href="{% url 'accounts:register' %}" style="color: #3498db; text-decoration: none;">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
